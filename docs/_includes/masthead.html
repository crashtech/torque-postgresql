<header class="masthead">
  <a class="brand" href="{{ '/' | relative_url }}">
    <svg viewBox="0 0 10 24" aria-hidden="true"><path d="M8.5 2 2 12l6.5 10"/></svg>
    <span class="brand-text"><strong>TORQUE</strong><em>PostgreSQL</em></span>
    <svg viewBox="0 0 10 24" aria-hidden="true"><path d="M1.5 2 8 12l-6.5 10"/></svg>
  </a>

  <nav class="sections">
    {%- for section in site.data.nav -%}
      {%- assign target = section.pages | where_exp: 'item', 'item.url' | first -%}
      {%- if target -%}
        <a href="{{ target.url | relative_url }}"
          {%- if page.section == section.id %} aria-current="true"{% endif %}>{{ section.title }}</a>
      {%- else -%}
        <a href="{{ '/#' | append: section.id | relative_url }}">{{ section.title }}</a>
      {%- endif -%}
    {%- endfor -%}
    <a href="https://github.com/{{ site.repository }}/issues">Open Issues</a>
  </nav>

  <span class="spacer"></span>

  <div class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg>
    <input class="search-input" type="search" placeholder="Search" aria-label="Search pages by name"
      autocomplete="off" data-search>
    <ul class="search-results" data-search-results></ul>
  </div>

  <span class="version">v{{ site.gem_version }}</span>

  <a class="icon-link" href="https://github.com/{{ site.repository }}" aria-label="Source on GitHub">
    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
  </a>

  <label class="toggle" for="theme" title="Switch colour scheme">
    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1.5 12h3M19.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
    <span class="visually-hidden">Switch colour scheme</span>
  </label>
</header>
