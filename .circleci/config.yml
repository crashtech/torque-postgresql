version: 2.1
orbs:
  ruby: circleci/ruby@1.4.0

jobs:
  test:
    parallelism: 3
    parameters:
      ruby-version:
        type: string
      bundle-version:
        type: string

    docker:
      - image: cimg/ruby:<< parameters.ruby-version >>
      - image: cimg/postgres:14.6
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: torque
          POSTGRES_DB: torque_postgresql

    steps:
      - checkout
      - run: ruby --version
      - run:
          command: 'bundle install --gemfile gemfiles/<< parameters.bundle-version >>'
          name: Install Bundle
      - run:
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
          name: Wait for DB
      - run:
          command: 'bundle exec --gemfile gemfiles/<< parameters.bundle-version >> rspec'
          name: Run Tests
          environment:
            DATABASE_URL: 'postgresql://postgres:torque@localhost/torque_postgresql'

  types:
    docker:
      - image: cimg/ruby:3.4
      - image: cimg/postgres:14.6
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: torque
          POSTGRES_DB: torque_postgresql

    steps:
      - checkout
      - run: ruby --version
      - run:
          command: 'bundle install --gemfile gemfiles/Gemfile.rails-8.1'
          name: Install Bundle
      - run:
          command: 'bundle exec --gemfile gemfiles/Gemfile.rails-8.1 rbs collection install'
          name: Install RBS collection
      - run:
          command: 'bundle exec --gemfile gemfiles/Gemfile.rails-8.1 rbs -I sig validate --exit-error-on-syntax-error'
          name: Validate signatures
      - run:
          command: dockerize -wait tcp://localhost:5432 -timeout 1m
          name: Wait for DB
      - run:
          command: 'bundle exec --gemfile gemfiles/Gemfile.rails-8.1 rspec'
          name: Run Typed Tests
          environment:
            DATABASE_URL: 'postgresql://postgres:torque@localhost/torque_postgresql'
            RBS_TEST: '1'
            RBS_TEST_TARGET: 'Torque::PostgreSQL::*,Torque::Generators::*'
            RBS_TEST_SKIP: '::Torque::PostgreSQL::Attributes::Lazy,::Torque::PostgreSQL::Adapter::OID::Range::Comparison'
            RBS_TEST_OPT: '-I sig'
            RBS_TEST_LOGLEVEL: warn

references:
  matrix_build: &matrix_build
    test:
      matrix:
        parameters:
          ruby-version: ['3.2', '3.3', '3.4']
          bundle-version: ['Gemfile.rails-8.0', 'Gemfile.rails-8.1']

workflows:
  commit:
    jobs:
      - <<: *matrix_build
      - types
